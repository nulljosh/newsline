name: Sidewise

options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "202608280953"
    DEVELOPMENT_TEAM: QMM486NPYC

schemes:
  Sidewise-iOS:
    build:
      targets:
        Sidewise-iOS: all
        Sidewise-Tests: [test]
    test:
      targets:
        - Sidewise-Tests
  Sidewise-macOS:
    build:
      targets:
        Sidewise-macOS: all

targets:
  Sidewise-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.newsline
        INFOPLIST_FILE: Sources/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  Sidewise-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.newsline
        INFOPLIST_FILE: Sources/macOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/macOS/Sidewise-macOS.entitlements

  Sidewise-Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Sidewise-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
